name: Grocery List

# Builds on main and publishes them as releases. The run number is the app's build number
# (versionCode), so pull requests are checked by grocery-list-check.yml instead: that keeps
# their runs from using up numbers and release builds stay sequential.
on:
  push:
    branches: [ main ]
    paths:
      - "grocery-list/**"
      - ".github/workflows/grocery-list.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grocery-list
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk grocery-list-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: grocery-list-apk
          path: grocery-list/grocery-list-${{ github.run_number }}.apk

      # On main, publish a release so the APK can be downloaded straight from the phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grocery-list-build-${{ github.run_number }}
          name: Grocery List build ${{ github.run_number }}
          files: grocery-list/grocery-list-${{ github.run_number }}.apk
          make_latest: false
