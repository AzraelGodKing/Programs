name: Autoclicker Build

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
    paths:
      - "autoclicker/**"
      - ".github/workflows/autoclicker-build.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "autoclicker/**"
      - ".github/workflows/autoclicker-build.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: autoclicker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Release
        run: dotnet build -c Release

      - name: Publish win-x64 single-file
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:DebugType=None /p:DebugSymbols=false

      - name: Upload published artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-win-x64
          path: autoclicker/bin/Release/net8.0-windows/win-x64/publish/**
