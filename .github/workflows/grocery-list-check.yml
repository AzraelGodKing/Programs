name: Grocery List check

# Tests and builds pull requests. Kept apart from grocery-list.yml so PR runs don't advance
# its run number, which is the build number of each release.
on:
  pull_request:
    branches: [ main ]
    paths:
      - "grocery-list/**"
      - ".github/workflows/grocery-list.yml"
      - ".github/workflows/grocery-list-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grocery-list
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: grocery-list-pr-apk
          path: grocery-list/app/build/outputs/apk/debug/app-debug.apk
