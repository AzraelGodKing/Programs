name: Lantern

on:
  push:
    branches: [ main ]
    paths:
      - "lantern/**"
      - "package.json"
      - ".github/workflows/lantern.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "lantern/**"
      - "package.json"
      - ".github/workflows/lantern.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: npm test
